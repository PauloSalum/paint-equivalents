name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go vet ./... && go test ./...
      # SITE_BASE decides both the canonical URL and the path prefix the output
      # is rebased onto, so moving to a custom domain is a one-variable change:
      # set it to https://paints.paulosalum.com and add -domain.
      - run: |
          go run ./cmd/build \
            -paints paints.json \
            -out dist \
            -per-brand 2 \
            -base "${SITE_BASE:-https://paulosalum.github.io/paint-equivalents}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
