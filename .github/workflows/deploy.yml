name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - run: go vet ./... && go test ./...
      # SITE_BASE decides both the canonical URL and the path prefix the output
      # is rebased onto; -domain writes the CNAME file Pages needs to keep
      # serving the custom domain after every deploy.
      - run: |
          go run ./cmd/build \
            -paints paints.json \
            -out dist \
            -per-brand 2 \
            -indexnow ebf1b4edc3967fa10083e575236c6da286399aff657e422b0670f3ffc0d36c46 \
            -domain paints.paulosalum.com \
            -adsense ca-pub-0047717629819717 \
            -adsense-slot 5507676182 \
            -amazon-tag paintequiv-20 \
            -amazon-host www.amazon.com.br \
            -base "${SITE_BASE:-https://paints.paulosalum.com}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
